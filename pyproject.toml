[project]
name = "snake-game"
version = "0.1.0"
description = "Snake with a DQN agent (desktop) and a NeoPixel build (ESP32)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "pygame",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly>=6.0.0rc0",
    "ipykernel",
    "nbformat",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13",
    "pytest>=8.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/desktop"]
# src/desktop is added to this list in Task 7 (after the rename from src/ai/).
# src/embedded is intentionally never added — it ships to the ESP32 via mpremote.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".mypy_cache", "model", "db", "notebooks"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",
    "F",
    "I",
    "N801", "N802", "N803",
    "PLE", "PLW",
    "UP",
]
ignore = [
    "PLR2004",
]

[tool.mypy]
python_version = "3.11"
files = ["src/common", "src/desktop"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["neopixel", "machine", "webrepl", "network"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit2"
